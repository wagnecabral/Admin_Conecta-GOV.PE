<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Conecta Gov.PE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body, #root { min-height:100%; }
body { font-family:'Inter',sans-serif; background:#F4F5F7; color:#28272C; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-thumb { background:#CED2D7; border-radius:3px; }
button, input, select, textarea { font-family:'Inter',sans-serif; }
.request-shell { max-width:1080px; margin:0 auto; width:100%; }
.request-layout { display:grid; grid-template-columns:250px minmax(0,1fr); gap:20px; align-items:start; }
.request-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.request-grid .full { grid-column:1/-1; }
.request-actions { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px; padding-top:20px; border-top:1px solid #E7E9EB; }
.request-actions-right { display:flex; gap:10px; margin-left:auto; }
.summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
@media (max-width: 820px) {
  .request-layout { grid-template-columns:1fr; }
  .request-grid, .summary-grid { grid-template-columns:1fr; }
  .request-grid .full { grid-column:auto; }
  .request-actions { align-items:stretch; flex-direction:column; }
  .request-actions-right { width:100%; margin-left:0; flex-direction:column-reverse; }
  .request-actions button, .request-actions-right button { width:100%; justify-content:center; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const C = {
  brand:'#0034B7', brandHover:'#337FFF', brandDark:'#001A7A',
  brandLight:'#E6F3FF', brandBorder:'#99C6FF',
  text:'#28272C', textSec:'#494C57',
  border:'#CED2D7', divider:'#E7E9EB',
  bg:'#F4F5F7', white:'#FFFFFF',
  gold:'#FFCD37',
  success:'#2B6418', successBg:'#EAFBD7', successBorder:'#86D562',
  danger:'#AC1010', dangerBg:'#FFE4E4', dangerBorder:'#E45F5F',
  warning:'#B77706', warningBg:'#FFF6CE',
};

/* ── GovBar ───────────────────────────────────────────────── */
function GovBar() {
  return (
    <div style={{ background:'#001A7A', height:32, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:7 }}>
        <span style={{ color:'#FFCD37', fontSize:14 }}>★</span>
        <span style={{ color:'#F8FAFC', fontSize:12, fontWeight:500 }}>Governo de Pernambuco</span>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        {['A-','A','A+'].map(t=>(
          <span key={t} style={{ color:'#F8FAFC', fontSize:12, fontWeight:700, cursor:'pointer', padding:'0 2px' }}>{t}</span>
        ))}
      </div>
    </div>
  );
}

/* ── Header ──────────────────────────────────────────────── */
function Header({ activePage, onNav, onAdminClick }) {
  const navItems = ['Início','Como Acessar APIs','Catálogo de APIs','Interoperabilidade','Quem somos'];
  return (
    <div style={{ background:'#FFFFFF', padding:'0 24px', display:'flex', alignItems:'center', justifyContent:'space-between', height:72, borderBottom:'1px solid #E7E9EB' }}>
      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
        <img src="../catalogo/assets/ati_logo.png" alt="ATI" style={{ height:44, width:'auto', objectFit:'contain' }} onError={e=>e.target.style.display='none'} />
        <div style={{ width:1, height:36, background:'#E7E9EB' }}/>
        <img src="../catalogo/assets/Brasao.png" alt="Brasão de Pernambuco" style={{ height:44, width:'auto', objectFit:'contain' }} onError={e=>e.target.style.display='none'} />
        <img src="../catalogo/assets/Governo.png" alt="Governo de Pernambuco" style={{ height:36, width:'auto', objectFit:'contain' }} onError={e=>e.target.style.display='none'} />
      </div>
      <nav style={{ display:'flex', gap:0, alignItems:'stretch', height:72 }}>
        {navItems.map(item => {
          const isActive = activePage === item;
          return (
            <div key={item} onClick={()=>onNav(item)} style={{ padding:'0 16px', height:72, display:'flex', alignItems:'center', fontSize:13, fontWeight:isActive?600:400, color:isActive?'#0034B7':'#28272C', borderBottom:isActive?'3px solid #0034B7':'3px solid transparent', cursor:'pointer', whiteSpace:'nowrap', transition:'all 0.15s' }}
              onMouseEnter={e=>{ if(!isActive){ e.currentTarget.style.color='#0034B7'; e.currentTarget.style.borderBottomColor='rgba(0,52,183,0.3)'; }}}
              onMouseLeave={e=>{ if(!isActive){ e.currentTarget.style.color='#28272C'; e.currentTarget.style.borderBottomColor='transparent'; }}}
            >{item}</div>
          );
        })}
      </nav>
      <div onClick={onAdminClick} style={{ padding:'0 16px', height:72, display:'flex', alignItems:'center', fontSize:13, fontWeight:400, color:'#28272C', borderBottom:'3px solid transparent', cursor:'pointer', whiteSpace:'nowrap', transition:'all 0.15s' }}
        onMouseEnter={e=>{ e.currentTarget.style.color='#0034B7'; e.currentTarget.style.borderBottomColor='rgba(0,52,183,0.3)'; }}
        onMouseLeave={e=>{ e.currentTarget.style.color='#28272C'; e.currentTarget.style.borderBottomColor='transparent'; }}
      >Acessar</div>
    </div>
  );
}

/* ── Hero ────────────────────────────────────────────────── */
function Hero({ onNav }) {
  return (
    <div style={{ background:C.bg, padding:'32px 24px 40px', display:'flex', justifyContent:'center' }}>
      <div style={{ background:`linear-gradient(160deg, #001A7A 0%, #0034B7 60%, #0A3FAA 100%)`, borderRadius:16, padding:'60px 56px 64px', maxWidth:900, width:'100%', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', right:-60, top:-60, width:280, height:280, borderRadius:'50%', background:'rgba(255,255,255,0.04)', pointerEvents:'none' }}/>
        <div style={{ position:'absolute', right:40, bottom:-80, width:200, height:200, borderRadius:'50%', background:'rgba(255,255,255,0.03)', pointerEvents:'none' }}/>
        <h1 style={{ fontSize:40, fontWeight:700, color:'#F8FAFC', marginBottom:12, letterSpacing:'-0.5px', lineHeight:1.15 }}>Conecta Gov.PE</h1>
        <p style={{ fontSize:17, fontWeight:600, color:'rgba(248,250,252,0.9)', marginBottom:16 }}>Conectando Soluções para um Governo Integrado</p>
        <p style={{ fontSize:14, color:'rgba(248,250,252,0.75)', lineHeight:1.6, maxWidth:480, marginBottom:32 }}>Plataforma estadual que facilita a interoperabilidade entre sistemas de informação e o compartilhamento seguro de dados através de APIs.</p>
        <div style={{ display:'flex', gap:12 }}>
          <button onClick={()=>onNav('Como Acessar APIs')} style={{ height:42, padding:'0 22px', borderRadius:5, background:C.brand, color:'#fff', fontSize:14, fontWeight:600, border:'none', cursor:'pointer' }}>Como acessar APIs</button>
          <button onClick={()=>onNav('Catálogo de APIs')} style={{ height:42, padding:'0 22px', borderRadius:5, background:'transparent', color:'#F8FAFC', fontSize:14, fontWeight:600, border:'1.5px solid rgba(248,250,252,0.5)', cursor:'pointer' }}>Consultar APIs</button>
        </div>
      </div>
    </div>
  );
}

/* ── Sobre ───────────────────────────────────────────────── */
function Sobre() {
  return (
    <div style={{ background:C.white, padding:'48px 24px' }}>
      <div style={{ maxWidth:900, margin:'0 auto' }}>
        <h2 style={{ fontSize:24, fontWeight:700, color:C.text, marginBottom:24 }}>Sobre o Conecta Gov.PE</h2>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:40 }}>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <p style={{ fontSize:13.5, color:C.textSec, lineHeight:1.7 }}>O Conecta Gov.PE é a plataforma estadual que promove a troca segura de informações entre sistemas. Inspirada no modelo federal do Conecta gov.br, a solução foca no princípio de que o governo não deve solicitar ao cidadão informações que o próprio Estado já possua.</p>
            <p style={{ fontSize:13.5, color:C.textSec, lineHeight:1.7 }}>Nesse contexto, o cidadão é o principal beneficiário, uma vez que a plataforma viabiliza jornadas de serviço unificadas e simplifica a interação com o Estado. Ao eliminar a necessidade de navegar por múltiplos portais ou de reapresentar documentos de forma redundante, as demandas passam a ser resolvidas em um ponto de contato mais ágil e inteligente.</p>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <p style={{ fontSize:13.5, color:C.textSec, lineHeight:1.7 }}>No âmbito administrativo, ao fornecer acesso a dados confiáveis, o Conecta Gov.PE minimiza a conferência manual de informações, diminuindo a incidência de erros e fraudes.</p>
            <p style={{ fontSize:13.5, color:C.textSec, lineHeight:1.7 }}>A governança do projeto é centralizada na ATI-PE (Agência Estadual de Tecnologia da Informação), que disponibiliza um catálogo unificado de APIs, processos simplificados para solicitação de acesso e documentação técnica de apoio. Todo esse suporte garante conformidade técnica e jurídica, com rigorosa observância à Lei Geral de Proteção de Dados (LGPD).</p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── FAQ ─────────────────────────────────────────────────── */
const FAQ_ITEMS = [
  'O que é uma API?','Quais conjuntos de dados estão disponíveis no Conecta Gov.PE?',
  'Quem pode utilizar o Conecta Gov.PE?','Quais são os requisitos para a adesão?',
  'Como posso acessar as APIs disponíveis?','Como faço para disponibilizar uma API no portal?',
  'O acesso às APIs tem algum custo?',
];

function FaqItem({ question }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ border:`1px solid ${C.divider}`, borderRadius:8, overflow:'hidden', marginBottom:8, background:C.white }}>
      <button onClick={()=>setOpen(o=>!o)} style={{ width:'100%', display:'flex', justifyContent:'space-between', alignItems:'center', padding:'16px 20px', background:'none', border:'none', cursor:'pointer', textAlign:'left' }}>
        <span style={{ fontSize:14, fontWeight:600, color:C.text }}>{question}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.brand} strokeWidth="2.5" strokeLinecap="round" style={{ flexShrink:0, transform:open?'rotate(180deg)':'none', transition:'transform 0.2s' }}><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      {open && (<div style={{ padding:'0 20px 16px', fontSize:13.5, color:C.textSec, lineHeight:1.7 }}>Entre em contato com a equipe pelo e-mail <strong>gestao.conecta.pe@ati.pe.gov.br</strong> para mais informações.</div>)}
    </div>
  );
}

function Faq() {
  return (
    <div style={{ background:C.bg, padding:'48px 24px' }}>
      <div style={{ maxWidth:900, margin:'0 auto' }}>
        <h2 style={{ fontSize:24, fontWeight:700, color:C.text, marginBottom:8 }}>Perguntas frequentes</h2>
        <p style={{ fontSize:13.5, color:C.textSec, marginBottom:28, lineHeight:1.6 }}>Separamos as perguntas mais frequentes. Caso sua resposta não esteja aqui, entre em contato: <strong>gestao.conecta.pe@ati.pe.gov.br</strong></p>
        {FAQ_ITEMS.map((q,i)=><FaqItem key={i} question={q}/>)}
      </div>
    </div>
  );
}

/* ── Footer ──────────────────────────────────────────────── */
function Footer() {
  return (
    <div style={{ background:'#0034B7', color:'#F8FAFC', padding:'40px 24px 0' }}>
      <div style={{ maxWidth:900, margin:'0 auto' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:48, paddingBottom:32 }}>
          <div>
            <div style={{ fontSize:15, fontWeight:700, color:'#F8FAFC', marginBottom:14 }}>Portal Conecta Gov.PE</div>
            <p style={{ fontSize:13, color:'rgba(248,250,252,0.65)', lineHeight:1.7, maxWidth:340 }}>Estrutura digital baseada no Padrão Pernambuco Digital para oferecer uma experiência mais consistente, acessível e integrada aos serviços do Estado.</p>
          </div>
          <div>
            <div style={{ fontSize:14, fontWeight:600, color:'#F8FAFC', marginBottom:12 }}>Contato institucional</div>
            <div style={{ fontSize:13, color:'rgba(248,250,252,0.65)', lineHeight:1.85 }}>
              <div>gestao.conecta.pe@ati.pe.gov.br</div>
              <div>(81) 3181-8121</div>
              <div>Av. Rio Capibaribe, 147 · São José · CEP: 50.020-080 · Recife-PE</div>
              <div>Horário: 8h às 12h e 13h às 17h</div>
            </div>
          </div>
        </div>
        <div style={{ borderTop:'1px solid rgba(248,250,252,0.2)', padding:'20px 0', display:'flex', alignItems:'center', justifyContent:'flex-end' }}>
          <div style={{ display:'flex', alignItems:'center', gap:20 }}>
            <img src="../catalogo/assets/ati_logo.png" alt="ATI" style={{ height:48, width:'auto', objectFit:'contain', filter:'brightness(0) invert(1)' }} onError={e=>e.target.style.display='none'} />
            <div style={{ width:1, height:40, background:'rgba(248,250,252,0.25)' }}/>
            <img src="../catalogo/assets/Brasao.png" alt="Brasão" style={{ height:48, width:'auto', objectFit:'contain', filter:'brightness(0) invert(1)' }} onError={e=>e.target.style.display='none'} />
            <img src="../catalogo/assets/Governo.png" alt="Governo PE" style={{ height:40, width:'auto', objectFit:'contain', filter:'brightness(0) invert(1)' }} onError={e=>e.target.style.display='none'} />
            <div style={{ width:1, height:40, background:'rgba(248,250,252,0.25)' }}/>
            <img src="../catalogo/assets/liga_digital.png" alt="Liga Digital" style={{ height:40, width:'auto', objectFit:'contain', filter:'brightness(0) invert(1)' }} onError={e=>e.target.style.display='none'} />
          </div>
        </div>
        <div style={{ borderTop:'1px solid rgba(248,250,252,0.08)', padding:'14px 0 18px' }}>
          <span style={{ fontSize:12, color:'rgba(248,250,252,0.35)' }}>Todos os direitos reservados | ATI – Agência Estadual de Tecnologia da Informação</span>
        </div>
      </div>
    </div>
  );
}

/* ── Catálogo ────────────────────────────────────────────── */
const ORGAOS_CAT = {
  '1':{ short:'ATI',    name:'Agência Estadual de Tecnologia da Informação' },
  '2':{ short:'SEFAZ',  name:'Secretaria da Fazenda' },
  '3':{ short:'SEPLAG', name:'Secretaria de Planejamento e Gestão' },
  '4':{ short:'SES',    name:'Secretaria de Saúde' },
  '5':{ short:'SEE',    name:'Secretaria de Educação' },
  '6':{ short:'SEDS',   name:'Secretaria de Desenvolvimento Social' },
};
const APIS_CAT = [
  { id:1, nome:'Catálogo de Serviços', orgaoId:'1', versao:'v2.1', status:'Ativo', descricao:'API pública de catálogo de serviços do estado de Pernambuco.', operacoes:'GET /servicos — lista todos os serviços\nGET /servicos/{id} — detalhe do serviço', baseSistema:'ATI — Portal de Serviços PE', comoAcessar:'Solicitar credenciais via portal ATI. Autenticar via Bearer Token.', detalhamento:'Protocolo HTTPS. Retorna JSON com campos: id, nome, orgao, descricao, status.', contatos:[{nome:'Time ATI', email:'api@ati.pe.gov.br'}], categoria:'Serviços', atualizado:'10/04/2025' },
  { id:2, nome:'Consulta de CPF', orgaoId:'2', versao:'v1.0', status:'Ativo', descricao:'Consulta de dados cadastrais de contribuintes via CPF.', operacoes:'GET /cpf/{numero} — retorna dados do cidadão', baseSistema:'SEFAZ — Cadastro Fiscal', comoAcessar:'Solicitar acesso via SEFAZ Digital. Requer convênio assinado.', detalhamento:'Protocolo HTTPS. IP fixo obrigatório. Retorna: nome, situação, data nascimento.', contatos:[{nome:'SEFAZ Digital', email:'digital@sefaz.pe.gov.br'}], categoria:'Fiscal', atualizado:'03/02/2025' },
  { id:4, nome:'Boletim de Ocorrência', orgaoId:'3', versao:'v3.0', status:'Ativo', descricao:'Registro e consulta de boletins de ocorrência policial.', operacoes:'POST /bo — registra BO\nGET /bo/{protocolo} — consulta BO', baseSistema:'SEPLAG — Segurança Pública', comoAcessar:'Credenciais fornecidas pela SEPLAG mediante solicitação formal.', detalhamento:'HTTPS. Retorna: protocolo, data, tipo, status, delegacia.', contatos:[{nome:'SEPLAG TI', email:'ti@seplag.pe.gov.br'}], categoria:'Segurança', atualizado:'18/04/2025' },
  { id:5, nome:'Emissão de Certidões', orgaoId:'2', versao:'v1.5', status:'Ativo', descricao:'Emissão de certidões fiscais e negativas de débitos estaduais.', operacoes:'GET /certidoes/negativa — emite CND\nGET /certidoes/debitos — lista débitos', baseSistema:'SEFAZ — Sistema Tributário', comoAcessar:'Integração via API Key. Solicitar chave no portal SEFAZ.', detalhamento:'HTTPS. Retorna PDF ou JSON: contribuinte, situação, validade.', contatos:[{nome:'SEFAZ', email:'sefaz@sefaz.pe.gov.br'}], categoria:'Fiscal', atualizado:'05/01/2025' },
  { id:8, nome:'Programas Habitacionais', orgaoId:'6', versao:'v1.1', status:'Ativo', descricao:'Inscrições e consultas em programas habitacionais do estado.', operacoes:'POST /inscricoes — realiza inscrição\nGET /inscricoes/{cpf} — consulta', baseSistema:'SEDS — Sistema Habitacional', comoAcessar:'API Key fornecida pela SEDS mediante solicitação.', detalhamento:'HTTPS. Retorna: inscrição, programa, situação, posição na fila.', contatos:[{nome:'SEDS TI', email:'ti@seds.pe.gov.br'}], categoria:'Social', atualizado:'20/02/2025' },
];

function DetailPage({ api, onBack, onRequest }) {
  const orgao = ORGAOS_CAT[api.orgaoId];
  const accessSteps = ['Selecionar a API desejada no Catálogo do Portal Conecta GOV.PE.','Clicar em Solicitar uso da API e autenticar-se com a conta GOV.BR.','Preencher e enviar o formulário de solicitação no próprio Conecta GOV.PE.','O Solicita criará o protocolo e encaminhará a demanda ao SEI.','Acompanhar a análise e as comunicações em Minhas Solicitações.','Após a aprovação, utilizar as credenciais disponibilizadas para realizar a integração.'];
  const SectionHeader = ({ title }) => (<div style={{ background:'#EEF1F6', padding:'9px 16px', borderBottom:`1px solid ${C.divider}` }}><span style={{ fontSize:13, fontWeight:600, color:C.text }}>{title}</span></div>);
  const SectionBody = ({ children }) => (<div style={{ background:C.white, padding:'12px 16px', fontSize:13, color:C.brand, lineHeight:1.75 }}>{children}</div>);
  const operacoes = (api.operacoes||'').split('\n').filter(Boolean);
  const sistemas = (api.baseSistema||'').split('\n').filter(Boolean);
  const detalheLines = (api.detalhamento||'').split('.').map(s=>s.trim()).filter(Boolean);
  return (
    <div style={{ background:C.bg, padding:'20px 32px', flex:1 }}>
      <div style={{ maxWidth:980, margin:'0 auto' }}>
        <button onClick={onBack} style={{ display:'inline-flex', alignItems:'center', gap:6, height:30, padding:'0 12px', borderRadius:5, border:`1px solid ${C.border}`, background:C.white, color:C.text, fontSize:12, cursor:'pointer', marginBottom:18 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Voltar ao catálogo
        </button>
        <div style={{ marginBottom:20 }}>
          <h1 style={{ fontSize:26, fontWeight:700, color:C.brand, marginBottom:3, letterSpacing:'-0.2px' }}>{api.nome}</h1>
          <div style={{ fontSize:13, color:C.textSec, marginBottom:1 }}>{orgao?.name} ({orgao?.short})</div>
          <div style={{ fontSize:13, color:C.textSec, marginBottom:10 }}>Versão {api.versao} • Atualizado em {api.atualizado}</div>
          <p style={{ fontSize:13.5, color:C.brand, lineHeight:1.6, maxWidth:720, marginBottom:16 }}>{api.descricao}</p>
          <button onClick={()=>onRequest(api)} style={{ height:38, padding:'0 20px', borderRadius:5, background:C.brand, color:'#fff', fontSize:14, fontWeight:600, border:'none', cursor:'pointer' }}>Solicitar uso da API</button>
        </div>
        <div style={{ border:`1px solid ${C.divider}`, borderRadius:8, overflow:'hidden' }}>
          <div style={{ borderBottom:`1px solid ${C.divider}` }}>
            <SectionHeader title="Principais Operações"/>
            <SectionBody>{operacoes.map((op,i)=>{ const method=op.match(/^(GET|POST|PUT|PATCH|DELETE)/)?.[1]; const rest=op.replace(/^(GET|POST|PUT|PATCH|DELETE)\s*/,''); const [endpoint,desc]=rest.split('—').map(s=>s.trim()); return (<div key={i} style={{ marginBottom:i<operacoes.length-1?6:0 }}>{method?<>{method==='GET'?'Consulta':method==='POST'?'Criação':method}: <code style={{ fontSize:12.5, background:'#F0F3F8', padding:'1px 5px', borderRadius:3 }}>{endpoint}</code>{desc?` — ${desc.toLowerCase()}`:''}</>:op}</div>); })}</SectionBody>
          </div>
          <div style={{ borderBottom:`1px solid ${C.divider}` }}>
            <SectionHeader title="Base/Sistemas de Origem"/>
            <SectionBody>{sistemas.map((s,i)=>(<div key={i} style={{ marginBottom:i<sistemas.length-1?4:0 }}>• {s}</div>))}</SectionBody>
          </div>
          <div style={{ borderBottom:`1px solid ${C.divider}` }}>
            <SectionHeader title="Como acessar a API"/>
            <SectionBody>{accessSteps.map((s,i)=>(<div key={i} style={{ marginBottom:i<accessSteps.length-1?4:0 }}>• {s}</div>))}</SectionBody>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr' }}>
            <div style={{ borderRight:`1px solid ${C.divider}` }}>
              <SectionHeader title="Detalhamento Técnico"/>
              <SectionBody>
                <div style={{ marginBottom:4 }}><strong style={{ color:C.text }}>Protocolo:</strong> REST/JSON</div>
                <div style={{ marginBottom:10 }}><strong style={{ color:C.text }}>IP Fixo:</strong> Obrigatório</div>

const USUARIOS_AUTORIZADOS = ['046.318.094-18','123.456.789-90','234.567.890-77'];

function SsoModal({ onClose, onAcessoNegado, onAcessoAutorizado, onGovBrAutenticado, requestMode=false }) {
  const [tela, setTela] = React.useState(requestMode?'govbr':'selecao');
  const [cpf, setCpf] = React.useState('');
  const [senha, setSenha] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [erro, setErro] = React.useState('');
  const CPF_AUTORIZADOS = ['046.318.094-18','123.456.789-90','234.567.890-77'];
  const formatCpf = v => { const n=v.replace(/\D/g,'').slice(0,11); if(n.length<=3)return n; if(n.length<=6)return n.slice(0,3)+'.'+n.slice(3); if(n.length<=9)return n.slice(0,3)+'.'+n.slice(3,6)+'.'+n.slice(6); return n.slice(0,3)+'.'+n.slice(3,6)+'.'+n.slice(6,9)+'-'+n.slice(9); };
  const resetForm = () => { setCpf(''); setSenha(''); setErro(''); };
  const handleVoltar = () => { resetForm(); setTela('selecao'); };
  const handleEntrar = () => {
    if(!cpf||!senha){ setErro('Preencha CPF e senha para continuar.'); return; }
    setLoading(true); setErro('');
    setTimeout(()=>{
      setLoading(false);
      if(tela==='govbr'){ if(onGovBrAutenticado) onGovBrAutenticado(cpf); }
      else { if(CPF_AUTORIZADOS.includes(cpf)){ onAcessoAutorizado(cpf); } else { onAcessoNegado(); } }
    }, 1400);
  };

  if(tela==='selecao') return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,26,122,0.5)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div style={{ background:'#fff', borderRadius:12, width:'100%', maxWidth:420, boxShadow:'0 8px 40px rgba(0,26,122,0.22)', overflow:'hidden' }}>

          <button onClick={()=>{ resetForm(); setTela('expresso'); }} style={{ width:'100%', height:48, borderRadius:100, background:'#0034B7', border:'none', color:'#fff', fontSize:15, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }} onMouseEnter={e=>e.currentTarget.style.background='#001A7A'} onMouseLeave={e=>e.currentTarget.style.background='#0034B7'}>Entrar com <strong>expresso.pe</strong></button>
          <div style={{ marginTop:24 }}><button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', fontSize:12, color:'#888' }}>← Voltar ao portal</button></div>
        </div>
      </div>
    </div>
  );

  if(tela==='govbr') return (
    <div style={{ position:'fixed', inset:0, background:'#1351B4', zIndex:1000, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div style={{ marginBottom:48, textAlign:'center' }}>
        <div style={{ display:'inline-flex', alignItems:'center', gap:0, background:'rgba(255,255,255,0.12)', borderRadius:8, padding:'8px 20px', border:'1px solid rgba(255,255,255,0.2)' }}>
          <span style={{ fontSize:28, fontWeight:900, color:'#fff', letterSpacing:'-1px' }}>gov</span>
          <span style={{ fontSize:28, fontWeight:900, color:'#FFCD07', letterSpacing:'-1px' }}>.br</span>

      </div>
      <div style={{ width:'100%', maxWidth:440 }}>
        {requestMode && <div style={{ background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,.22)', borderRadius:7, padding:'10px 13px', fontSize:12.5, color:'#fff', marginBottom:22, lineHeight:1.5 }}>Entre com sua conta GOV.BR para continuar a solicitação da API. No protótipo, use o CPF <strong>046.318.094-18</strong> e qualquer senha.</div>}

/* Componentes definidos fora do fluxo para preservar o foco durante a digitação. */
const RequestFormContext = React.createContext(null);

function TextInput({ name, ...props }) {
  const { form, update } = React.useContext(RequestFormContext);
  return <input {...props} value={form[name]} onChange={e=>update(name,e.target.value)} style={{...fieldStyle,...(props.readOnly?readOnlyStyle:{})}}/>;
}

function TextArea({ name, ...props }) {
  const { form, update } = React.useContext(RequestFormContext);
  return <textarea {...props} value={form[name]} onChange={e=>update(name,e.target.value)} style={{...fieldStyle,minHeight:92,resize:'vertical',lineHeight:1.5}}/>;
}

const fieldStyle = { width:'100%', minHeight:42, border:'1px solid #AEB4BD', borderRadius:5, padding:'9px 12px', fontSize:13.5, color:'#28272C', background:'#fff', outline:'none' };
const readOnlyStyle = { ...fieldStyle, background:'#F0F2F5', color:'#494C57', cursor:'not-allowed' };

function RequestStepper({ step }) {
  const steps = ['Identificação','Aplicação e escopo técnico','Finalidade e LGPD','Revisão e envio'];
  return (
    <aside style={{ background:'#fff', border:`1px solid ${C.divider}`, borderRadius:10, padding:'20px 18px', position:'sticky', top:18 }}>
      <div style={{ fontSize:12, fontWeight:700, color:C.textSec, textTransform:'uppercase', letterSpacing:'.5px', marginBottom:16 }}>Etapas da solicitação</div>
      {steps.map((label,i)=>{
        const done=i<step, active=i===step;
        return (
          <div key={label} style={{ display:'flex', gap:10, position:'relative', paddingBottom:i<steps.length-1?22:0 }}>
            {i<steps.length-1 && (
              <div style={{ position:'absolute', left:12, top:25, bottom:0, width:2, background:done?C.brand:'#D9DEE5' }}/>
            )}
            <div style={{ width:26, height:26, borderRadius:'50%', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:done||active?'#fff':C.textSec, background:done||active?C.brand:'#EEF1F5', border:active?`3px solid ${C.brandBorder}`:'none', boxSizing:'border-box', zIndex:1 }}>{done?'✓':i+1}</div>
            <div style={{ paddingTop:4, fontSize:13, fontWeight:active?700:500, color:active?C.brand:done?C.text:C.textSec, lineHeight:1.35 }}>{label}</div>
          </div>
        );
      })}
      <div style={{ marginTop:20, paddingTop:16, borderTop:`1px solid ${C.divider}`, fontSize:11.5, color:C.textSec, lineHeight:1.55 }}>
        Os dados serão enviados ao Solicita, que criará o protocolo e encaminhará o processo ao SEI.
      </div>
    </aside>
  );
}

function SolicitacaoApiForm({ api, usuario, onCancel, onSubmitted }) {
  const orgaoCedente = ORGAOS_CAT[api.orgaoId];
  const [step,setStep] = React.useState(0);
  const [error,setError] = React.useState('');
  const [sending,setSending] = React.useState(false);
  const [submitted,setSubmitted] = React.useState(null);
  const [form,setForm] = React.useState({
    nomeAplicacao:'', sigla:'', descricao:'',
    tipoSolicitante:usuario.tipo==='empresa'?'Empresa':'Órgão público', cnpj:'', nomeEmpresa:'',
    nomeResponsavelNegocio:usuario.nome||'', cpfResponsavelNegocio:usuario.cpf||'', email:usuario.email||'', telefone:'',
    cargoResponsavelNegocio:'', areaDemandante:'', matriculaResponsavelNegocio:'',
    nomeResponsavelTecnico:'', emailResponsavelTecnico:'', telefoneResponsavelTecnico:'', cargoResponsavelTecnico:'', matriculaResponsavelTecnico:'',
    orgaoDemandante:usuario.orgao||'',
    hml:true, prd:false, ipHml:'', ipPrd:'', volumetria:'', justificativa:'',
    tipoDados:'publicos', hipotese:'', outroHipotese:'', usoDados:'', politicas:'', sistemas:'', resultados:'', previsaoLegal:'', duracao:'', observacoes:'', declaracao:false
  });
  const update = (key,value) => setForm(prev=>({...prev,[key]:value}));
  const changeTipoSolicitante = value => setForm(prev=>({
    ...prev,
    tipoSolicitante:value,
    ...(value==='Empresa'
      ? { orgaoDemandante:'', matriculaResponsavelNegocio:'', matriculaResponsavelTecnico:'' }
      : { nomeEmpresa:'' })
  }));
  const requiredByStep = [
    [['tipoSolicitante','Tipo solicitante'],['cnpj','CNPJ'],['nomeResponsavelNegocio','Nome completo'],['cpfResponsavelNegocio','CPF responsável negócio'],['email','Email'],['telefone','Telefone'],['cargoResponsavelNegocio','Cargo função'],['areaDemandante','Área demandante'],['nomeResponsavelTecnico','Nome completo responsável técnico'],['emailResponsavelTecnico','Email responsável técnico'],['telefoneResponsavelTecnico','Telefone responsável técnico'],['cargoResponsavelTecnico','Cargo função responsável técnico']],
    [['nomeAplicacao','Nome da aplicação'],['sigla','Sigla'],['descricao','Descrição da aplicação'],['volumetria','Volumetria anual'],['justificativa','Justificativa da demanda']],
    [['usoDados','Como os dados serão utilizados'],['politicas','Políticas públicas impactadas'],['sistemas','Serviços ou sistemas integrados'],['resultados','Resultados pretendidos para o cidadão'],['previsaoLegal','Previsão legal ou vínculo']],
  ];
  const validate = () => {
    const missing=(requiredByStep[step]||[]).find(([key])=>!String(form[key]||'').trim());
    if(missing){ setError(`Preencha o campo “${missing[1]}” para continuar.`); return false; }
    if(step===0 && form.tipoSolicitante==='Empresa' && !form.nomeEmpresa.trim()){ setError('Preencha o campo “Nome empresa” para continuar.'); return false; }
    if(step===0 && form.tipoSolicitante==='Órgão público' && !form.orgaoDemandante.trim()){ setError('Preencha o campo “Órgão demandante” para continuar.'); return false; }
    if(step===0 && form.tipoSolicitante==='Órgão público' && !form.matriculaResponsavelTecnico.trim()){ setError('Preencha o campo “Matrícula responsável técnico” para continuar.'); return false; }
    if(step===0 && form.tipoSolicitante==='Órgão público' && !form.matriculaResponsavelNegocio.trim()){ setError('Preencha o campo “Matrícula responsável negócio” para continuar.'); return false; }
    if(step===0 && form.cnpj.replace(/\D/g,'').length!==14){ setError('Informe um CNPJ válido, com 14 dígitos.'); return false; }
    if(step===0 && form.cpfResponsavelNegocio.replace(/\D/g,'').length!==11){ setError('Informe um CPF válido, com 11 dígitos.'); return false; }
    if(step===0 && form.nomeResponsavelNegocio.trim().length<3){ setError('O nome do responsável pelo negócio deve ter pelo menos 3 caracteres.'); return false; }
    if(step===0 && !/^\S+@\S+\.\S+$/.test(form.email)){ setError('Informe um e-mail válido para o responsável pelo negócio.'); return false; }
    if(step===0 && form.telefone.replace(/\D/g,'').length<10){ setError('Informe um telefone válido para o responsável pelo negócio.'); return false; }
    if(step===0 && form.nomeResponsavelTecnico.trim().length<3){ setError('O nome do responsável técnico deve ter pelo menos 3 caracteres.'); return false; }
    if(step===0 && !/^\S+@\S+\.\S+$/.test(form.emailResponsavelTecnico)){ setError('Informe um e-mail válido para o responsável técnico.'); return false; }
    if(step===0 && form.telefoneResponsavelTecnico.replace(/\D/g,'').length<10){ setError('Informe um telefone válido para o responsável técnico.'); return false; }
    if(step===1 && !form.hml && !form.prd){ setError('Selecione ao menos um ambiente.'); return false; }
    if(step===1 && form.hml && !form.ipHml.trim()){ setError('Informe o IP ou CIDR de saída para homologação.'); return false; }
    if(step===1 && form.prd && !form.ipPrd.trim()){ setError('Informe o IP ou CIDR de saída para produção.'); return false; }
    if(step===2 && form.tipoDados!=='publicos' && !form.hipotese){ setError('Selecione a hipótese de tratamento de dados pessoais.'); return false; }
    setError(''); return true;
  };
  const next = () => { if(validate()){ setStep(s=>Math.min(3,s+1)); window.scrollTo({top:0,behavior:'smooth'}); } };
  const back = () => { setError(''); setStep(s=>Math.max(0,s-1)); window.scrollTo({top:0,behavior:'smooth'}); };
  const submit = () => {
    if(!form.declaracao){ setError('Confirme a veracidade das informações antes de enviar.'); return; }
    setError(''); setSending(true);
    setTimeout(()=>{
      const seq=String(Math.floor(100000+Math.random()*899999));
      const check=String(Math.floor(10+Math.random()*89));
      const protocol=`0030409428.${seq}/2026-${check}`;
      const request={ id:Date.now(), protocolo:protocol, api:api.nome, orgaoCedente:orgaoCedente?.short||'ATI', dataSolicitacao:'10/09/2026', dataAtualizacao:'10/09/2026', status:'Em Análise', formData:form, historico:[{ tipo:'processo', msg:'Solicitação recebida pelo Conecta GOV.PE, protocolada no Solicita e encaminhada ao SEI.', data:'10/09/2026, 14:35' }] };
      setSending(false); setSubmitted(request); onSubmitted(request);
    },1300);
  };
  const formatCnpj = value => { const n=value.replace(/\D/g,'').slice(0,14); return n.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); };
  const formatPhone = value => { const n=value.replace(/\D/g,'').slice(0,11); if(n.length<=2)return n?`(${n}`:''; if(n.length<=6)return `(${n.slice(0,2)}) ${n.slice(2)}`; if(n.length<=10)return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`; return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`; };

  if(submitted) return (
    <div style={{ minHeight:'calc(100vh - 104px)', background:C.bg, padding:'36px 24px' }}>
      <div style={{ maxWidth:760, margin:'0 auto', background:'#fff', border:`1px solid ${C.divider}`, borderRadius:12, padding:'38px 40px', boxShadow:'0 5px 25px rgba(0,26,122,.08)' }}>
        <div style={{ width:58, height:58, borderRadius:'50%', background:C.successBg, border:`2px solid ${C.successBorder}`, color:C.success, display:'flex', alignItems:'center', justifyContent:'center', fontSize:27, fontWeight:700, marginBottom:18 }}>✓</div>
        <h1 style={{ fontSize:24, color:C.brandDark, marginBottom:8 }}>Solicitação enviada com sucesso</h1>
        <p style={{ fontSize:14, color:C.textSec, lineHeight:1.6, marginBottom:24 }}>O Solicita criou o protocolo e encaminhou a solicitação ao SEI. Você poderá acompanhar todas as atualizações em Minhas Solicitações.</p>
        <div style={{ background:'#F5F8FF', border:`1px solid ${C.brandBorder}`, borderRadius:8, padding:'18px 20px', marginBottom:24 }}>
          <div className="summary-grid">
            {[['API solicitada',api.nome],['Órgão cedente',orgaoCedente?.name],['Protocolo',submitted.protocolo],['Situação','Em análise']].map(([k,v])=><div key={k}><div style={{ fontSize:11, color:C.textSec, marginBottom:4 }}>{k}</div><div style={{ fontSize:13.5, fontWeight:700, color:k==='Protocolo'?C.brandDark:C.text, fontFamily:k==='Protocolo'?'monospace':'inherit' }}>{v}</div></div>)}
          </div>
        </div>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
          <button onClick={()=>onCancel('requests')} style={{ height:42, padding:'0 20px', border:0, borderRadius:5, background:C.brand, color:'#fff', fontSize:14, fontWeight:700, cursor:'pointer' }}>Acompanhar em Minhas Solicitações</button>
          <button onClick={()=>onCancel('catalog')} style={{ height:42, padding:'0 20px', border:`1px solid ${C.border}`, borderRadius:5, background:'#fff', color:C.text, fontSize:14, fontWeight:600, cursor:'pointer' }}>Voltar ao catálogo</button>
        </div>
      </div>
    </div>
  );

  return (
    <RequestFormContext.Provider value={{form,update}}>
    <div style={{ background:C.bg, padding:'26px 24px 44px', flex:1 }}>
      <div className="request-shell">
        <button onClick={()=>onCancel('detail')} style={{ background:'none', border:0, color:C.brand, cursor:'pointer', fontSize:12.5, marginBottom:14, padding:0 }}>← Voltar ao detalhamento da API</button>
        <div style={{ marginBottom:20 }}>
          <div style={{ fontSize:12, color:C.textSec, marginBottom:4 }}>Solicitação de uso de API</div>
          <h1 style={{ fontSize:25, color:C.brandDark, marginBottom:6 }}>{api.nome}</h1>
          <p style={{ fontSize:13.5, color:C.textSec }}>Preencha as informações para que o Solicita gere o protocolo e encaminhe a demanda ao SEI.</p>
        </div>
        <div className="request-layout">
          <RequestStepper step={step}/>
          <section style={{ background:'#fff', border:`1px solid ${C.divider}`, borderRadius:10, padding:'26px 28px', minWidth:0 }}>
            {error && <div role="alert" style={{ background:C.dangerBg, border:`1px solid ${C.dangerBorder}`, borderRadius:6, padding:'11px 14px', color:C.danger, fontSize:13, marginBottom:20 }}>{error}</div>}

            {step===0 && <>
              <h2 style={{ fontSize:19, color:C.text, marginBottom:5 }}>Identificação</h2>
              <p style={{ fontSize:12.5, color:C.textSec, marginBottom:22 }}>Confirme os dados que serão enviados ao Solicita para identificação do solicitante e geração do protocolo. O nome completo e o CPF são preenchidos pelo GOV.BR e não podem ser alterados.</p>
              <div className="request-grid">
                <FormField label="Nome da API" full><input value={api.nome} readOnly style={readOnlyStyle}/></FormField>
                <FormField label="Tipo solicitante" required><select value={form.tipoSolicitante} onChange={e=>changeTipoSolicitante(e.target.value)} style={fieldStyle}><option>Órgão público</option><option>Empresa</option></select></FormField>
                <FormField label="CNPJ" required><input value={form.cnpj} onChange={e=>update('cnpj',formatCnpj(e.target.value))} inputMode="numeric" maxLength="18" placeholder="00.000.000/0000-00" style={fieldStyle}/></FormField>
                {form.tipoSolicitante==='Empresa' && <FormField label="Nome empresa" required full><TextInput name="nomeEmpresa" minLength="2" maxLength="150" placeholder="Informe a razão social ou o nome da empresa"/></FormField>}
                <FormField label="Nome completo" required><input value={form.nomeResponsavelNegocio} readOnly style={readOnlyStyle}/></FormField>
                <FormField label="CPF responsável negócio" required><input value={form.cpfResponsavelNegocio} readOnly style={readOnlyStyle}/></FormField>
                <FormField label="Email" required><TextInput name="email" type="email" minLength="5" maxLength="150"/></FormField>
                <FormField label="Telefone" required><input value={form.telefone} onChange={e=>update('telefone',formatPhone(e.target.value))} inputMode="tel" maxLength="15" placeholder="(81) 99999-9999" style={fieldStyle}/></FormField>
                <FormField label="Cargo função" required><TextInput name="cargoResponsavelNegocio" minLength="2" maxLength="100" placeholder="Informe o cargo ou função"/></FormField>
                <FormField label="Área demandante" required><TextInput name="areaDemandante" minLength="2" maxLength="120" placeholder="Ex.: GGTI"/></FormField>
                <div className="full" style={{ borderTop:`1px solid ${C.divider}`, paddingTop:20, marginTop:2 }}><h3 style={{ fontSize:15, color:C.text, marginBottom:4 }}>Responsável técnico</h3><p style={{ fontSize:12, color:C.textSec }}>Informe quem responderá tecnicamente pela integração e pelo consumo da API.</p></div>
                <FormField label="Nome completo responsável técnico" required><TextInput name="nomeResponsavelTecnico" minLength="3" maxLength="150"/></FormField>
                <FormField label="Email responsável técnico" required><TextInput name="emailResponsavelTecnico" type="email" minLength="5" maxLength="150"/></FormField>
                <FormField label="Telefone responsável técnico" required><input value={form.telefoneResponsavelTecnico} onChange={e=>update('telefoneResponsavelTecnico',formatPhone(e.target.value))} inputMode="tel" maxLength="15" placeholder="(81) 99999-9999" style={fieldStyle}/></FormField>
                <FormField label="Cargo função responsável técnico" required><TextInput name="cargoResponsavelTecnico" minLength="2" maxLength="100"/></FormField>
                {form.tipoSolicitante==='Órgão público' && <>
                  <FormField label="Órgão demandante" required full><TextInput name="orgaoDemandante" minLength="2" maxLength="150" placeholder="Informe o órgão ou entidade"/></FormField>
                  <FormField label="Matrícula responsável técnico" required><TextInput name="matriculaResponsavelTecnico" minLength="1" maxLength="30" inputMode="numeric"/></FormField>
                  <FormField label="Matrícula responsável negócio" required><TextInput name="matriculaResponsavelNegocio" minLength="1" maxLength="30" inputMode="numeric" placeholder="Informe a matrícula"/></FormField>
                </>}
              </div>
            </>}

            {step===1 && <>
              <h2 style={{ fontSize:19, color:C.text, marginBottom:5 }}>Aplicação, escopo técnico e estimativa de uso</h2>
              <p style={{ fontSize:12.5, color:C.textSec, marginBottom:22 }}>Informe a aplicação que consumirá a API, os ambientes, endereços de saída e a estimativa de consumo.</p>
              <div className="request-grid">
                <FormField label="Nome da aplicação" required><TextInput name="nomeAplicacao" minLength="3" maxLength="120" placeholder="Ex.: Portal de Serviços PE"/></FormField>
                <FormField label="Sigla" required hint="De 2 a 15 caracteres."><TextInput name="sigla" minLength="2" maxLength="15" placeholder="Ex.: PSPE"/></FormField>
                <FormField label="Descrição da aplicação" required full hint="Descreva resumidamente a finalidade da aplicação. Entre 20 e 1.000 caracteres."><TextArea name="descricao" minLength="20" maxLength="1000"/></FormField>
                <FormField label="Ambientes solicitados" required full>
                  <div style={{ display:'flex', gap:20, minHeight:42, alignItems:'center', border:`1px solid ${C.border}`, borderRadius:5, padding:'0 12px' }}>

                </FormField>

                {form.prd && <FormField label="IP ou faixa CIDR de PRD" required hint="Informe um endereço válido de saída da rede."><TextInput name="ipPrd" maxLength="50" placeholder="Ex.: 200.100.50.20/32"/></FormField>}

                <FormField label="Justificativa da demanda" required full hint="Considere usuários, frequência de acesso e possíveis picos de sazonalidade."><TextArea name="justificativa" minLength="20" maxLength="1000"/></FormField>

            </>}

            {step===2 && <>
              <h2 style={{ fontSize:19, color:C.text, marginBottom:5 }}>Finalidade e conformidade legal</h2>
              <p style={{ fontSize:12.5, color:C.textSec, marginBottom:22 }}>Os campos de LGPD são exibidos conforme a natureza dos dados tratados pela API.</p>

            </>}

                  ['Identificação',[['Tipo solicitante',form.tipoSolicitante],['CNPJ',form.cnpj],...(form.tipoSolicitante==='Empresa'?[['Nome empresa',form.nomeEmpresa]]:[]),['Nome completo',form.nomeResponsavelNegocio],['CPF responsável negócio',form.cpfResponsavelNegocio],['Email',form.email],['Telefone',form.telefone],['Cargo função',form.cargoResponsavelNegocio],['Área demandante',form.areaDemandante],...(form.tipoSolicitante==='Órgão público'?[['Órgão demandante',form.orgaoDemandante],['Matrícula responsável negócio',form.matriculaResponsavelNegocio]]:[])]],
                  ['Responsável técnico',[['Nome completo',form.nomeResponsavelTecnico],['Email',form.emailResponsavelTecnico],['Telefone',form.telefoneResponsavelTecnico],['Cargo função',form.cargoResponsavelTecnico],...(form.tipoSolicitante==='Órgão público'?[['Matrícula responsável técnico',form.matriculaResponsavelTecnico]]:[])]],
                  ['Aplicação e API',[['Aplicação',form.nomeAplicacao],['Sigla',form.sigla],['API',api.nome],['Versão',api.versao]]],
                  ['Escopo técnico',[['Ambiente',`${form.hml?'HML':''}${form.hml&&form.prd?' e ':''}${form.prd?'PRD':''}`],['IP HML',form.ipHml||'Não solicitado'],['IP PRD',form.ipPrd||'Não solicitado'],['Volumetria anual',Number(form.volumetria||0).toLocaleString('pt-BR')+' requisições']]],
                  ['Finalidade',[['Natureza dos dados',form.tipoDados==='publicos'?'Dados públicos':form.tipoDados==='pessoais'?'Dados pessoais':'Dados pessoais sensíveis'],['Políticas públicas',form.politicas],['Sistemas integrados',form.sistemas],['Previsão legal',form.previsaoLegal]]]
                ].map(([title,items])=><div key={title} style={{ border:`1px solid ${C.divider}`, borderRadius:8, overflow:'hidden' }}><div style={{ background:'#EEF1F6', padding:'9px 14px', fontSize:13, fontWeight:700 }}>{title}</div><div className="summary-grid" style={{ padding:'14px' }}>{items.map(([k,v])=><div key={k}><div style={{ fontSize:10.5, color:C.textSec, marginBottom:3 }}>{k}</div><div style={{ fontSize:12.5, color:C.text, fontWeight:600, lineHeight:1.45 }}>{v||'Não informado'}</div></div>)}</div></div>)}
              </div>
              <label style={{ display:'flex', alignItems:'flex-start', gap:9, marginTop:20, padding:'13px 14px', border:`1px solid ${C.border}`, borderRadius:7, fontSize:12.5, color:C.text, lineHeight:1.5, cursor:'pointer' }}><input type="checkbox" checked={form.declaracao} onChange={e=>update('declaracao',e.target.checked)} style={{ marginTop:3 }}/><span>Declaro que as informações prestadas são verdadeiras e que possuo autorização para solicitar o uso desta API em nome do órgão ou entidade informado.</span></label>
            </>}

            <div className="request-actions">
              <button onClick={()=>onCancel('detail')} style={{ height:40, padding:'0 16px', border:0, background:'transparent', color:C.textSec, fontSize:13, cursor:'pointer' }}>Cancelar</button>
              <div className="request-actions-right">
                {step>0 && <button onClick={back} style={{ height:40, padding:'0 18px', border:`1px solid ${C.border}`, borderRadius:5, background:'#fff', color:C.text, fontSize:13, fontWeight:600, cursor:'pointer' }}>Voltar</button>}
                {step<3 ? <button onClick={next} style={{ height:40, padding:'0 22px', border:0, borderRadius:5, background:C.brand, color:'#fff', fontSize:13, fontWeight:700, cursor:'pointer' }}>Continuar</button> : <button onClick={submit} disabled={sending} style={{ height:40, padding:'0 22px', border:0, borderRadius:5, background:sending?'#7A91C9':C.brand, color:'#fff', fontSize:13, fontWeight:700, cursor:sending?'wait':'pointer' }}>{sending?'Enviando ao Solicita...':'Enviar solicitação'}</button>}
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
    </RequestFormContext.Provider>
  );
}

/* ─────────────────────────────────────────────────────────────
   COMPONENTE: MinhasSolicitacoes
   Implementado conforme FEATURE.06 — Acomp. de Solicitação de Uso
   de API pelo Cidadão (Login GOV.BR) e Ata de Reunião 17/06/2026.

   CA.02 — Título "Minhas Solicitações" / Subtítulo "Acompanhe suas
           solicitações de acesso às APIs do Conecta Gov.PE."
   CA.03 — Filtro de Fase: Todas as fases / Em análise / Concluído /
           Cancelado (sem Pendente, Aprovada, Reprovada, Suspenso,
           Comunicação, Em atendimento).
   CA.04 — Ordenação: Atualização mais recente (padrão) / Data de
           criação / Protocolo.
   CA.05 — Grid: Nº Protocolo, Solicitação (Nome da API), Órgão,
           Data da Requisição, Fase (badge colorida), Expandir.
   CA.06 — Resumo da solicitação (somente leitura, reflete a API).
   CA.07 — Timeline dinâmica: Em análise (1 etapa) -> Concluído
           (2 etapas) -> Cancelado (2 etapas, com X). Concluído e
           Cancelado são estados finais alternativos (nunca exibidos
           juntos).
   CA.08 — Mensagem de status conforme o status atual.
   CA.09 — Aviso de compartilhamento do link pessoal, exibido
           somente na área de detalhes.
   CA.10 — Histórico ordenado do mais recente para o mais antigo.
   CA.11 — Ícones do histórico: Informação, Comunicação, Carta,
           Remessa, Processo Gerado.
───────────────────────────────────────────────────────────── */
function MinhasSolicitacoes({ usuario, onSair, novasSolicitacoes=[] }) {
  const todasSolicitacoes = [...novasSolicitacoes, ...(GOVBR_SOLICITACOES[usuario.cpf] || [])];

  // CA.03 — Filtro de Fase: apenas os 3 status oficiais do Solicita (SEI)
  const FASES_FILTRO = ['Em Análise', 'Concluído', 'Cancelado'];

  const [filtroFase, setFiltroFase] = React.useState('');
  // CA.04 — Ordenação padrão: Atualização mais recente
  const [filtroOrdem, setFiltroOrdem] = React.useState('recente');
  const [expandido, setExpandido] = React.useState({});

  const toggleExpandir = (id) => setExpandido(prev => ({ ...prev, [id]: !prev[id] }));

  // Helper para converter datas dd/mm/aaaa em objeto Date (ordenação)
  const parseDataBr = (str) => {
    const [d, m, y] = str.split('/');
    return new Date(+y, +m - 1, +d);
  };

  const ordenadas = [...todasSolicitacoes].sort((a, b) => {
    if (filtroOrdem === 'recente') return parseDataBr(b.dataAtualizacao) - parseDataBr(a.dataAtualizacao);
    if (filtroOrdem === 'antigo') return parseDataBr(b.dataSolicitacao) - parseDataBr(a.dataSolicitacao);
    return a.protocolo.localeCompare(b.protocolo);
  });

  const filtradas = filtroFase ? ordenadas.filter(s => s.status === filtroFase) : ordenadas;

  // Configuração visual por status — apenas os 3 status oficiais
  const statusCfg = {
    'Em Análise': { bg:'#FFF6CE', color:'#B77706', border:'#FFE082', dot:'#B77706', banner:'#FFFBEB', bannerBorder:'#FFE082', bannerColor:'#B77706' },
    'Concluído':  { bg:'#EAFBD7', color:'#2B6418', border:'#86D562', dot:'#2B6418', banner:'#F0FBE8', bannerBorder:'#C2EEAC', bannerColor:'#2B6418' },
    'Cancelado':  { bg:'#FFE4E4', color:'#AC1010', border:'#E45F5F', dot:'#AC1010', banner:'#FFF0F0', bannerBorder:'#E45F5F', bannerColor:'#AC1010' },
  };

  // CA.08 — Mensagem de status
  const bannerMsg = {
    'Em Análise': 'A sua solicitação está em análise.',
    'Concluído':  'A sua solicitação foi finalizada.',
    'Cancelado':  'A sua solicitação foi cancelada.',
  };

  // CA.11 — Ícones do histórico, por tipo de movimentação
  const HistIcon = ({ tipo }) => {
    const baseStyle = { width:30, height:30, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 };
    if (tipo === 'carta') return (
      <div style={{ ...baseStyle, background:'#E6F3FF', border:'1px solid #99C6FF' }} title="Comunicação enviada / E-mail enviado">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0034B7" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
    );
    if (tipo === 'comunicacao') return (
      <div style={{ ...baseStyle, background:'#FFF6CE', border:'1px solid #FFE082' }} title="Comunicação / hashtag de sinalização">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B77706" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
    );
    if (tipo === 'remessa') return (
      <div style={{ ...baseStyle, background:'#F0F3F8', border:'1px solid #CED2D7' }} title="Processo remetido / Movimentação entre unidades">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#494C57" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </div>
    );
    if (tipo === 'processo') return (
      <div style={{ ...baseStyle, background:'#E6F3FF', border:'1px solid #99C6FF' }} title="Criação do processo / Início da solicitação">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0034B7" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
    );
    // 'info' (default) — Avisos / Informativos
    return (
      <div style={{ ...baseStyle, background:'#F0F3F8', border:'1px solid #CED2D7' }} title="Informação / Aviso">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#494C57" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </div>
    );
  };

  const StatusBadge = ({ status }) => {
    const c = statusCfg[status] || { bg:'#F1EFE8', color:'#5F5E5A', border:'#D3D1C7', dot:'#888' };
    return (
      <span style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'3px 10px', borderRadius:100, fontSize:11, fontWeight:700, background:c.bg, color:c.color, border:`1px solid ${c.border}`, flexShrink:0 }}>
        <span style={{ width:6, height:6, borderRadius:'50%', background:c.dot }}/>
        {status}
      </span>
    );
  };

  // CA.07 — Timeline dinâmica.
  // Cenário 01 (Em análise): apenas a etapa "Em análise" concluída.
  // Cenário 02 (Concluído): "Em análise" -> "Concluído", ambas com check.
  // Cenário 03 (Cancelado): "Em análise" -> "Cancelado", a última com X.
  // Concluído e Cancelado nunca aparecem ao mesmo tempo (estados finais alternativos).
  const Timeline = ({ status }) => {
    const steps = status === 'Cancelado'
      ? [{ label:'Em análise', state:'done' }, { label:'Cancelado', state:'cancel' }]
      : status === 'Concluído'
      ? [{ label:'Em análise', state:'done' }, { label:'Concluído', state:'done' }]
      : [{ label:'Em análise', state:'active' }];

    return (
      <div style={{ display:'flex', alignItems:'center', marginBottom:14 }}>
        {steps.map((step, i) => (
          <React.Fragment key={i}>
            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
              <div style={{
                width:24, height:24, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:11, fontWeight:700,
                background: step.state==='done' ? '#1351B4' : step.state==='cancel' ? '#AC1010' : '#fff',
                border: step.state==='active' ? '2px solid #1351B4' : 'none',
                color: (step.state==='done' || step.state==='cancel') ? '#fff' : '#1351B4',
              }}>
                {step.state==='done' ? '✓' : step.state==='cancel' ? '✕' : i+1}
              </div>
              <span style={{ fontSize:11, fontWeight:600, color: step.state==='cancel' ? '#AC1010' : '#1351B4', whiteSpace:'nowrap' }}>{step.label}</span>
            </div>
            {i < steps.length-1 && <div style={{ flex:1, height:2, background:'#1351B4', margin:'0 6px' }}/>}
          </React.Fragment>
        ))}
      </div>
    );
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:'#F4F5F7', fontFamily:"'Inter',sans-serif" }}>

      {/* Barra gov.pe */}
      <div style={{ background:'#001A7A', height:32, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:7 }}>
          <span style={{ color:'#FFCD37', fontSize:14 }}>★</span>
          <span style={{ color:'#F8FAFC', fontSize:12, fontWeight:500 }}>Governo de Pernambuco</span>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {['A-','A','A+'].map(t=><span key={t} style={{ color:'#F8FAFC', fontSize:12, fontWeight:700, cursor:'pointer', padding:'0 2px' }}>{t}</span>)}
        </div>
      </div>

      {/* Header */}
      <div style={{ background:'#fff', borderBottom:'1px solid #E7E9EB', padding:'0 24px', display:'flex', alignItems:'center', justifyContent:'space-between', height:64 }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <img src="../catalogo/assets/ati_logo.png" alt="ATI" style={{ height:40, width:'auto', objectFit:'contain' }} onError={e=>e.target.style.display='none'}/>
          <div style={{ width:1, height:32, background:'#E7E9EB' }}/>
          <img src="../catalogo/assets/Brasao.png" alt="Brasão" style={{ height:40, width:'auto', objectFit:'contain' }} onError={e=>e.target.style.display='none'}/>
          <img src="../catalogo/assets/Governo.png" alt="Gov PE" style={{ height:32, width:'auto', objectFit:'contain' }} onError={e=>e.target.style.display='none'}/>
          <div style={{ width:1, height:32, background:'#E7E9EB' }}/>
          <span style={{ fontSize:14, fontWeight:700, color:'#001A7A' }}>Conecta Gov.PE</span>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <div style={{ display:'flex', alignItems:'center', gap:6, background:'#F0F4FF', border:'1px solid #C7D6FF', borderRadius:100, padding:'4px 12px' }}>
            <div style={{ display:'flex', alignItems:'center', background:'#1351B4', borderRadius:4, padding:'2px 6px' }}>
              <span style={{ fontSize:10, fontWeight:900, color:'#fff', letterSpacing:'-0.5px' }}>gov</span>
              <span style={{ fontSize:10, fontWeight:900, color:'#FFCD07', letterSpacing:'-0.5px' }}>.br</span>
            </div>
            <span style={{ fontSize:12, fontWeight:600, color:'#001A7A' }}>{usuario.nome.split(' ')[0]}</span>
          </div>
          <button onClick={onSair}
            style={{ height:34, padding:'0 14px', borderRadius:6, border:'1px solid #E45F5F', background:'#fff', color:'#AC1010', fontSize:12, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}
            onMouseEnter={e=>e.currentTarget.style.background='#FFE4E4'}
            onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#AC1010" strokeWidth="2" strokeLinecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
          </button>
        </div>
      </div>

      {/* Conteúdo */}
      <div style={{ flex:1, padding:'28px 24px', maxWidth:900, width:'100%', margin:'0 auto' }}>

        {/* CA.02 — Título e subtítulo */}
        <div style={{ marginBottom:20 }}>
          <h1 style={{ fontSize:22, fontWeight:700, color:'#001A7A', marginBottom:4 }}>Minhas Solicitações</h1>
          <div style={{ fontSize:13, color:'#494C57' }}>
            <span>Acompanhe suas solicitações de acesso às APIs do Conecta Gov.PE.</span>
          </div>
        </div>

        {/* Filtros */}
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16, flexWrap:'wrap', justifyContent:'space-between' }}>
          {/* CA.03 — Filtro de Fase: Todas as fases / Em análise / Concluído / Cancelado */}
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:12, color:'#494C57', fontWeight:600 }}>Fase:</span>
            <div style={{ position:'relative' }}>
              <select value={filtroFase} onChange={e=>setFiltroFase(e.target.value)} style={{ height:32, border:'1px solid #CED2D7', borderRadius:5, padding:'0 26px 0 10px', fontSize:12, color:'#28272C', background:'#fff', outline:'none', appearance:'none', cursor:'pointer', fontFamily:"'Inter',sans-serif" }}>
                <option value="">Todas as fases</option>
                {FASES_FILTRO.map(f=><option key={f} value={f}>{f === 'Em Análise' ? 'Em análise' : f}</option>)}
              </select>
              <span style={{ position:'absolute', right:7, top:'50%', transform:'translateY(-50%)', pointerEvents:'none', fontSize:10, color:'#666' }}>▾</span>
            </div>
          </div>
          {/* CA.04 — Ordenação: Atualização mais recente (padrão) / Data de criação / Protocolo */}
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:12, color:'#494C57', fontWeight:600 }}>Classificar por:</span>
            <div style={{ position:'relative' }}>
              <select value={filtroOrdem} onChange={e=>setFiltroOrdem(e.target.value)} style={{ height:32, border:'1px solid #CED2D7', borderRadius:5, padding:'0 26px 0 10px', fontSize:12, color:'#28272C', background:'#fff', outline:'none', appearance:'none', cursor:'pointer', fontFamily:"'Inter',sans-serif" }}>
                <option value="recente">Atualização mais recente</option>
                <option value="antigo">Data de criação</option>
                <option value="protocolo">Protocolo</option>
              </select>
              <span style={{ position:'absolute', right:7, top:'50%', transform:'translateY(-50%)', pointerEvents:'none', fontSize:10, color:'#666' }}>▾</span>
            </div>
          </div>
        </div>

        {/* Aba dinâmica: Órgão Público | Empresa */}
        <div style={{ display:'flex', gap:0, borderBottom:'2px solid #E7E9EB', marginBottom:16 }}>
          <button style={{ padding:'8px 18px', border:'none', background:'none', fontSize:13, fontWeight:700, color:'#0034B7', cursor:'default', borderBottom:'2px solid #0034B7', marginBottom:'-2px', fontFamily:"'Inter',sans-serif" }}>
            {usuario.tipoLabel || 'Solicitante'} ({todasSolicitacoes.length})
          </button>
        </div>

        {/* CA.05 — Grid de Solicitações + Lista expansível */}
        {filtradas.length === 0 ? (
          <div style={{ background:'#fff', border:'1px solid #E7E9EB', borderRadius:10, padding:'48px', textAlign:'center', color:'#888', fontSize:13 }}>Nenhuma solicitação encontrada para a fase selecionada.</div>
        ) : (
          <div style={{ background:'#fff', border:'1px solid #E7E9EB', borderRadius:10, overflow:'hidden', marginBottom:10 }}>

            {/* Cabeçalho da grid */}
            <div style={{ display:'grid', gridTemplateColumns:'2fr 2.5fr 1.4fr 1.3fr 1fr', background:'#F8FAFC', borderBottom:'2px solid #E7E9EB', padding:'0 16px' }}>
              {['Nº Protocolo','Solicitação','Data da Requisição','Fase',''].map((h,i)=>(
                <div key={i} style={{ padding:'10px 8px 10px', fontSize:11, fontWeight:700, color:'#494C57', textTransform:'uppercase', letterSpacing:'0.5px', textAlign:i===4?'right':'left' }}>{h}</div>
              ))}
            </div>

            {/* Linhas da grid */}
            <div>
            {filtradas.map(sol => {
              const aberto = !!expandido[sol.id];
              const cfg = statusCfg[sol.status] || {};
              const msg = bannerMsg[sol.status] || '';
              // CA.10 — Histórico do mais recente para o mais antigo (já cadastrado nessa ordem nos dados mock)
              return (
                <div key={sol.id} style={{ borderBottom:'1px solid #F0F2F5' }}>

                  {/* Linha clicável */}
                  <div
                    style={{ display:'grid', gridTemplateColumns:'2fr 2.5fr 1.4fr 1.3fr 1fr', padding:'0 16px', alignItems:'center', cursor:'pointer', transition:'background 0.12s', background:aberto?'#F0F5FF':'#fff', minHeight:52 }}
                    onClick={()=>toggleExpandir(sol.id)}
                    onMouseEnter={e=>{ if(!aberto) e.currentTarget.style.background='#F8FAFC'; }}
                    onMouseLeave={e=>{ if(!aberto) e.currentTarget.style.background='#fff'; }}>

                    {/* Nº Protocolo */}
                    <div style={{ padding:'12px 8px' }}>
                      <code style={{ fontSize:11, fontFamily:'monospace', background:'#F4F5F7', padding:'2px 7px', borderRadius:4, color:'#444', display:'inline-block' }}>{sol.protocolo}</code>
                    </div>

                    {/* Solicitação (Nome da API + Órgão) */}
                    <div style={{ padding:'12px 8px' }}>
                      <div style={{ fontSize:13, fontWeight:700, color:'#001A7A', marginBottom:2 }}>{sol.api}</div>
                      <span style={{ fontSize:10, fontWeight:700, background:'#E6F3FF', color:'#0034B7', padding:'1px 7px', borderRadius:100, border:'1px solid #99C6FF' }}>{sol.orgaoCedente}</span>
                    </div>

                    {/* Data de Requisição */}
                    <div style={{ padding:'12px 8px', fontSize:12, color:'#28272C', fontWeight:500 }}>{sol.dataSolicitacao}</div>

                    {/* Fase (badge colorida) */}
                    <div style={{ padding:'12px 8px' }}>
                      <StatusBadge status={sol.status}/>
                    </div>

                    {/* Ação — Expandir */}
                    <div style={{ padding:'12px 8px', textAlign:'right', display:'flex', alignItems:'center', justifyContent:'flex-end', gap:6 }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0034B7" strokeWidth="2.5" strokeLinecap="round" style={{ transform:aberto?'rotate(180deg)':'none', transition:'transform 0.2s', flexShrink:0 }}><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                  </div>

                  {/* CA.06 — Resumo expandido (somente leitura) */}
                  {aberto && (
                    <div style={{ borderTop:'1px solid #F0F2F5', padding:'16px 20px' }} onClick={e=>e.stopPropagation()}>

                      <div style={{ background:'#F8FAFC', border:'1px solid #E7E9EB', borderRadius:8, padding:'12px 16px', marginBottom:16, display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
                        {[['Data da criação',sol.dataSolicitacao],['Última atualização',sol.dataAtualizacao],['Status',sol.status],['Protocolo',sol.protocolo]].map(([k,v])=>(
                          <div key={k}>
                            <div style={{ fontSize:10, color:'#888', marginBottom:2 }}>{k}</div>
                            <div style={{ fontSize:12, fontWeight:600, color:'#28272C', fontFamily:k==='Protocolo'?'monospace':'inherit' }}>{v}</div>
                          </div>
                        ))}
                      </div>

                      {/* CA.07 — Timeline dinâmica */}
                      <Timeline status={sol.status}/>

                      {/* CA.08 — Banner de mensagem de status */}
                      <div style={{ background:cfg.banner, border:`1px solid ${cfg.bannerBorder}`, borderRadius:6, padding:'10px 14px', display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={cfg.bannerColor} strokeWidth="2" strokeLinecap="round" style={{ flexShrink:0 }}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        <span style={{ fontSize:13, color:cfg.bannerColor, fontWeight:500 }}>{msg}</span>
                      </div>

                      {/* CA.09 — Aviso de compartilhamento (somente na área de detalhes) */}
                      <div style={{ background:'#F0F3F8', border:'1px solid #CED2D7', borderRadius:6, padding:'10px 14px', display:'flex', alignItems:'flex-start', gap:8, marginBottom:16 }}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#494C57" strokeWidth="2" strokeLinecap="round" style={{ flexShrink:0, marginTop:1 }}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span style={{ fontSize:12, color:'#494C57', lineHeight:1.5 }}>O link de acompanhamento é pessoal e não deve ser compartilhado. O compartilhamento é de responsabilidade do usuário.</span>
                      </div>

                      {/* CA.10 / CA.11 — Histórico com ícones por tipo de movimentação */}
                      <div>
                        <div style={{ fontSize:13, fontWeight:700, color:'#28272C', marginBottom:10 }}>Histórico</div>
                        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                          {sol.historico.map((h, i) => (
                            <div key={i} style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                              <HistIcon tipo={h.tipo}/>
                              <div style={{ background:'#F8FAFC', border:'1px solid #E7E9EB', borderRadius:8, padding:'10px 14px', flex:1 }}>
                                <div style={{ fontSize:11, fontWeight:700, color:'#444', marginBottom:5 }}>Atendimento · {h.data}</div>
                                <p style={{ fontSize:12, color:'#494C57', lineHeight:1.65, whiteSpace:'pre-line' }}>{h.msg}</p>
                                {h.avaliar && (
                                  <button onClick={e=>e.stopPropagation()} style={{ marginTop:8, height:28, padding:'0 14px', borderRadius:100, background:'#1351B4', border:'none', color:'#fff', fontSize:11, fontWeight:700, cursor:'pointer' }}>Avaliar serviço</button>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}
                </div>
              );
            })}
            </div>
          </div>
        )}

      </div>

      {/* Footer */}
      <div style={{ background:'#0034B7', padding:'20px 24px', marginTop:'auto' }}>
        <div style={{ maxWidth:900, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'flex-end', gap:20 }}>
          <img src="../catalogo/assets/ati_logo.png" alt="ATI" style={{ height:36, objectFit:'contain', filter:'brightness(0) invert(1)' }} onError={e=>e.target.style.display='none'}/>
          <div style={{ width:1, height:32, background:'rgba(255,255,255,0.25)' }}/>
          <img src="../catalogo/assets/Governo.png" alt="Gov PE" style={{ height:28, objectFit:'contain', filter:'brightness(0) invert(1)' }} onError={e=>e.target.style.display='none'}/>
        </div>
        <div style={{ maxWidth:900, margin:'8px auto 0', borderTop:'1px solid rgba(255,255,255,0.15)', paddingTop:12 }}>
          <span style={{ fontSize:11, color:'rgba(255,255,255,0.4)' }}>Todos os direitos reservados | ATI – Agência Estadual de Tecnologia da Informação</span>
        </div>
      </div>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = React.useState('Início');
  const [showSsoModal, setShowSsoModal] = React.useState(false);
  const [authContext, setAuthContext] = React.useState('area');
  const [telaAcessoNegado, setTelaAcessoNegado] = React.useState(null);
  const [detailApi, setDetailApi] = React.useState(null);
  const [govbrUsuario, setGovbrUsuario] = React.useState(null);
  const [novasSolicitacoes, setNovasSolicitacoes] = React.useState([]);
  const [usuariosCadastrados, setUsuariosCadastrados] = React.useState([...USUARIOS_AUTORIZADOS]);

  const handleAdminClick = () => { setAuthContext('area'); setShowSsoModal(true); };
  const handleRequestApi = (api) => {
    setDetailApi(api);
    if(govbrUsuario){ setPage('__request__'); }
    else { setAuthContext('request'); setShowSsoModal(true); }
  };

  const handleAutenticar = (cpf) => {
    const cpfLimpo = cpf.trim();
    if(usuariosCadastrados.includes(cpfLimpo)){
      try { window.location.href = '../gerenciar-apis/index.html'; }
      catch(e) { alert('Acesso autorizado! Redirecionando para o backoffice...'); }
    } else {
      setUsuariosCadastrados(prev => prev.includes(cpfLimpo) ? prev : [...prev, cpfLimpo]);
      setTelaAcessoNegado(cpfLimpo);
    }
  };

  const handleGovBrAutenticar = (cpf) => {
    const cpfLimpo = cpf.trim();
    const usuario = GOVBR_USUARIOS[cpfLimpo];
    if(usuario){
      setGovbrUsuario(usuario);
    } else {
      setGovbrUsuario({ nome:'Cidadão', cpf:cpfLimpo, email:'', orgao:'', tipo:'orgao', tipoLabel:'Órgão Público' });
    }
    setShowSsoModal(false);
    setPage(authContext==='request'?'__request__':'__requests__');
  };

  if(page==='__requests__' && govbrUsuario) return <MinhasSolicitacoes usuario={govbrUsuario} novasSolicitacoes={novasSolicitacoes} onSair={()=>{setGovbrUsuario(null);setPage('Início');}}/>;
  if(telaAcessoNegado) return <AcessoNegadoScreen cpf={telaAcessoNegado} onVoltar={()=>setTelaAcessoNegado(null)}/>;

  if(page==='__request__' && govbrUsuario && detailApi) return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <GovBar/>
      <Header activePage="Catálogo de APIs" onNav={p=>{setPage(p);}} onAdminClick={handleAdminClick}/>
      <SolicitacaoApiForm
        api={detailApi}
        usuario={govbrUsuario}
        onSubmitted={sol=>setNovasSolicitacoes(prev=>[sol,...prev])}
        onCancel={target=>{
          if(target==='requests') setPage('__requests__');
          else if(target==='catalog') { setDetailApi(null); setPage('Catálogo de APIs'); }
          else setPage('__detail__');
        }}
      />
      <Footer/>
    </div>
  );

  if(page === '__detail__') return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <GovBar/>
      <Header activePage="Catálogo de APIs" onNav={p=>{ setDetailApi(null); setPage(p); }} onAdminClick={handleAdminClick}/>
      <main style={{ flex:1 }}>
        <DetailPage api={detailApi} onBack={()=>{ setDetailApi(null); setPage('Catálogo de APIs'); }} onRequest={handleRequestApi}/>
      </main>
      <Footer/>
      {showSsoModal && (
        <SsoModal requestMode={authContext==='request'} onClose={()=>setShowSsoModal(false)} onAcessoNegado={()=>{setShowSsoModal(false);}} onAcessoAutorizado={handleAutenticar} onGovBrAutenticado={handleGovBrAutenticar}/>
      )}
    </div>
  );

  const pageContent = {
    'Início':           (<><Hero onNav={setPage}/><Sobre/><Faq/></>),
    'Como Acessar APIs':<ComoAcessar onNav={setPage}/>,
    'Catálogo de APIs': <CatalogPage onSelectApi={api=>{ setDetailApi(api); setPage('__detail__'); }}/>,
    'Interoperabilidade':<Interoperabilidade/>,
    'Quem somos':       <QuemSomos/>,
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <GovBar/>
      <Header activePage={page} onNav={setPage} onAdminClick={handleAdminClick}/>
      <main style={{ flex:1, display:'flex', flexDirection:'column' }}>
        {pageContent[page]}
      </main>
      <Footer/>
      {showSsoModal && (
        <SsoModal
          onClose={()=>setShowSsoModal(false)}
          onAcessoNegado={()=>{setShowSsoModal(false);}}
          onAcessoAutorizado={handleAutenticar}
          onGovBrAutenticado={handleGovBrAutenticar}
          requestMode={authContext==='request'}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
