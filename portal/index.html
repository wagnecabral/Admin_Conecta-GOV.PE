<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conecta Gov.PE — Minhas Solicitações</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{min-height:100%}
body{font-family:'Inter',sans-serif;background:#f4f5f7;color:#28272c}
button,select,input{font-family:'Inter',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const C = {
  brand:'#0034B7', brandDark:'#001A7A', brandLight:'#E6F3FF', brandBorder:'#99C6FF',
  text:'#28272C', textSec:'#494C57', border:'#CED2D7', divider:'#E7E9EB',
  success:'#2B6418', successBg:'#EAFBD7', successBorder:'#86D562',
  danger:'#AC1010', dangerBg:'#FFE4E4', dangerBorder:'#E45F5F',
  warning:'#B77706', warningBg:'#FFF6CE', warningBorder:'#FFE082',
  white:'#FFFFFF', bg:'#F4F5F7'
};

const usuario = {
  nome:'Wagne Goveia Cabral',
  cpf:'046.318.094-18',
  tipoLabel:'Órgão Público'
};

/*
  Conforme Ata de 17/06/2026:
  - O Portal deve utilizar exclusivamente os status retornados pela API do Solicita;
  - Os status oficiais considerados são: Em análise, Concluído e Cancelado;
  - Não deve ser criado status próprio, como "Pendente";
  - Histórico, ícones, comunicações e alertas devem refletir o retorno da API.
*/
const SOLICITACOES = [
  {
    id: 1,
    protocolo:'SEI-PE 2026.0002693916',
    api:'Disponibilizar uma API na Plataforma do Conecta',
    orgao:'ATI',
    dataCriacao:'26/01/2026, 13:27',
    dataAtualizacao:'27/01/2026, 15:01',
    fase:'Concluído',
    status:'Concluído',
    historico:[
      {tipo:'info', titulo:'Atendimento', data:'27 jan. 2026, 15:03', texto:'Favor adicionar documento extra'},
      {tipo:'comentario', titulo:'Atendimento', data:'27 jan. 2026, 15:02', texto:'#pendente favor adicionar documento extra'},
      {tipo:'comentario', titulo:'Atendimento', data:'27 jan. 2026, 15:01', texto:'#suspenso: favor anexar a documentação complementar xxxx'},
      {tipo:'carta', titulo:'Atendimento', data:'27 jan. 2026, 15:00', texto:': favor anexar a documentação complementar xxxx'},
      {tipo:'remetido', titulo:'Movimentação', data:'26 jan. 2026, 14:46', texto:'Processo remetido pela unidade ATI - GAS'},
      {tipo:'inicio', titulo:'Solicitação', data:'26 jan. 2026, 13:27', texto:'Processo restrito gerado, informação pessoal.'}
    ]
  },
  {
    id: 2,
    protocolo:'SEI-PE 2026.00000018-7',
    api:'Consulta de CPF',
    orgao:'SEFAZ',
    dataCriacao:'18/04/2026, 09:15',
    dataAtualizacao:'22/04/2026, 11:00',
    fase:'Em análise',
    status:'Em análise',
    historico:[
      {tipo:'comunicacao', titulo:'Atendimento', data:'22 abr. 2026, 11:00', texto:'Comunicação enviada ao solicitante para complementação de informações técnicas.'},
      {tipo:'documento', titulo:'Atendimento', data:'18 abr. 2026, 09:15', texto:'Solicitação recebida e protocolada no Solicita.'}
    ]
  },
  {
    id: 3,
    protocolo:'SEI-PE 2026.00000031-4',
    api:'Catálogo de Serviços',
    orgao:'ATI',
    dataCriacao:'10/05/2026, 10:00',
    dataAtualizacao:'10/05/2026, 17:00',
    fase:'Cancelado',
    status:'Cancelado',
    historico:[
      {tipo:'alerta', titulo:'Atendimento', data:'10 mai. 2026, 17:00', texto:'Solicitação cancelada conforme andamento registrado no Solicita.'},
      {tipo:'documento', titulo:'Atendimento', data:'10 mai. 2026, 10:00', texto:'Solicitação recebida e protocolada no Solicita.'}
    ]
  }
];

function GovBar(){
  return (
    <div style={{height:32,background:C.brandDark,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px'}}>
      <div style={{display:'flex',alignItems:'center',gap:7}}>
        <span style={{color:'#FFCD37',fontSize:14}}>★</span>
        <span style={{color:'#F8FAFC',fontSize:12,fontWeight:600}}>Governo de Pernambuco</span>
      </div>
      <div style={{display:'flex',gap:10}}>
        {['A-','A','A+'].map(t=><span key={t} style={{color:'#fff',fontSize:12,fontWeight:800}}>{t}</span>)}
      </div>
    </div>
  );
}

function Header(){
  return (
    <div style={{height:64,background:'#fff',borderBottom:`1px solid ${C.divider}`,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px'}}>
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <img src="../assets/ati_logo.png" alt="ATI" style={{height:40,width:'auto',objectFit:'contain'}} onError={e=>e.currentTarget.style.display='none'}/>
        <div style={{width:1,height:32,background:C.divider}}/>
        <img src="../assets/Brasao.png" alt="Brasão" style={{height:40,width:'auto',objectFit:'contain'}} onError={e=>e.currentTarget.style.display='none'}/>
        <img src="../assets/Governo.png" alt="Governo de Pernambuco" style={{height:32,width:'auto',objectFit:'contain'}} onError={e=>e.currentTarget.style.display='none'}/>
        <div style={{width:1,height:32,background:C.divider}}/>
        <span style={{fontSize:14,fontWeight:800,color:C.brandDark}}>Conecta Gov.PE</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:6,background:'#F0F4FF',border:'1px solid #C7D6FF',borderRadius:100,padding:'4px 12px'}}>
          <span style={{background:'#1351B4',borderRadius:4,padding:'2px 6px',fontSize:10,fontWeight:900,color:'#fff'}}>
            gov<span style={{color:'#FFCD07'}}>.br</span>
          </span>
          <span style={{fontSize:12,fontWeight:700,color:C.brandDark}}>{usuario.nome.split(' ')[0]}</span>
        </div>
        <button style={{height:34,padding:'0 14px',borderRadius:6,border:`1px solid ${C.dangerBorder}`,background:'#fff',color:C.danger,fontSize:12,fontWeight:700,cursor:'pointer'}}>Sair</button>
      </div>
    </div>
  );
}

function StatusBadge({fase}){
  const cfg = {
    'Em análise': {bg:C.warningBg,color:C.warning,border:C.warningBorder,dot:C.warning},
    'Concluído': {bg:C.successBg,color:C.success,border:C.successBorder,dot:C.success},
    'Cancelado': {bg:C.dangerBg,color:C.danger,border:C.dangerBorder,dot:C.danger}
  }[fase];
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:100,fontSize:12,fontWeight:700,background:cfg.bg,color:cfg.color,border:`1px solid ${cfg.border}`}}>
      <span style={{width:7,height:7,borderRadius:'50%',background:cfg.dot}}/>
      {fase}
    </span>
  );
}

function IconeHistorico({tipo}){
  const common = {
    width:36,
    height:36,
    borderRadius:'50%',
    background:'#2F73C9',
    display:'flex',
    alignItems:'center',
    justifyContent:'center',
    color:'#fff',
    flexShrink:0,
    boxShadow:'0 1px 2px rgba(0,0,0,0.10)'
  };

  const Svg = ({children}) => (
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );

  const icons = {
    /* Ícone de informação — utilizado para avisos simples retornados no histórico */
    info: <Svg><circle cx="12" cy="12" r="9"/><line x1="12" y1="10" x2="12" y2="16"/><circle cx="12" cy="7" r="0.8" fill="#fff" stroke="none"/></Svg>,

    /* Ícone de mensagem/comunicação — usado para hashtags como #pendente, #suspenso, #comunicacao */
    comentario: <Svg><rect x="4" y="5" width="16" height="12" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="15" y2="13"/><path d="M8 17l-3 3v-5"/></Svg>,

    /* Ícone de carta — usado quando a comunicação dispara e-mail/carta ao solicitante */
    carta: <Svg><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M4 8l8 6 8-6"/></Svg>,

    /* Ícone de remessa/movimentação — usado para processo remetido entre unidades */
    remetido: <Svg><line x1="5" y1="12" x2="18" y2="12"/><polyline points="13 7 18 12 13 17"/></Svg>,

    /* Ícone de início/processo gerado */
    inicio: <Svg><polygon points="9 7 17 12 9 17 9 7" fill="#fff" stroke="#fff"/></Svg>,

    documento: <Svg><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v5h5"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="14" y2="16"/></Svg>,
    avaliacao: <Svg><circle cx="12" cy="12" r="9"/><polyline points="7 12 10.5 15.5 17 9"/></Svg>,
    alerta: <Svg><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Svg>,
    comunicacao: <Svg><rect x="4" y="5" width="16" height="12" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="15" y2="13"/></Svg>
  };

  return <div style={common}>{icons[tipo] || icons.documento}</div>;
}

function IconeTituloHistorico(){
  return (
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F73C9" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
      <path d="M5 4h13v14H5z"/>
      <path d="M8 8h7"/>
      <path d="M8 12h7"/>
      <path d="M3 7v14h13"/>
    </svg>
  );
}

function Timeline({fase}){
  const stepBase = {
    display:'flex',
    alignItems:'center',
    gap:7
  };

  const circleBase = {
    width:28,
    height:28,
    borderRadius:'50%',
    display:'flex',
    alignItems:'center',
    justifyContent:'center',
    color:'#fff',
    fontSize:12,
    fontWeight:800,
    flexShrink:0
  };

  const labelBase = {
    fontSize:12,
    fontWeight:700,
    whiteSpace:'nowrap'
  };

  const Step = ({label, color, symbol}) => (
    <div style={stepBase}>
      <div style={{...circleBase, background:color}}>{symbol}</div>
      <span style={{...labelBase, color}}>{label}</span>
    </div>
  );

  if(fase === 'Em análise'){
    return (
      <div style={{display:'flex',alignItems:'center',margin:'16px 0 18px'}}>
        <Step label="Em análise" color="#1351B4" symbol="✓" />
      </div>
    );
  }

  if(fase === 'Concluído'){
    return (
      <div style={{display:'flex',alignItems:'center',margin:'16px 0 18px'}}>
        <Step label="Em análise" color="#1351B4" symbol="✓" />
        <div style={{flex:1,height:2,background:'#1351B4',margin:'0 8px'}}/>
        <Step label="Concluído" color="#1351B4" symbol="✓" />
      </div>
    );
  }

  if(fase === 'Cancelado'){
    return (
      <div style={{display:'flex',alignItems:'center',margin:'16px 0 18px'}}>
        <Step label="Em análise" color="#1351B4" symbol="✓" />
        <div style={{flex:1,height:2,background:C.dangerBorder,margin:'0 8px'}}/>
        <Step label="Cancelado" color={C.dangerBorder} symbol="✕" />
      </div>
    );
  }

  return null;
}

function BannerFase({fase}){
  const cfg = {
    'Em análise': {bg:'#FFFBEB',border:C.warningBorder,color:C.warning,msg:'A sua solicitação está em análise. As comunicações serão exibidas no histórico conforme retorno da API do Solicita.'},
    'Concluído': {bg:'#F0FBE8',border:'#C2EEAC',color:C.success,msg:'A sua solicitação foi finalizada.'},
    'Cancelado': {bg:'#FFF0F0',border:C.dangerBorder,color:C.danger,msg:'A sua solicitação foi cancelada.'}
  }[fase];

  return (
    <div style={{background:cfg.bg,border:`1px solid ${cfg.border}`,borderRadius:8,padding:'11px 14px',display:'flex',gap:9,alignItems:'center',marginBottom:14}}>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={cfg.color} strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span style={{fontSize:13,color:cfg.color,fontWeight:600}}>{cfg.msg}</span>
    </div>
  );
}

function LinhaSolicitacao({sol}){
  const [aberto,setAberto]=React.useState(false);
  return (
    <div style={{borderBottom:`1px solid ${C.divider}`}}>
      <div onClick={()=>setAberto(!aberto)} style={{display:'grid',gridTemplateColumns:'2fr 2.5fr 1.4fr 1.4fr 60px',alignItems:'center',padding:'0 16px',minHeight:62,cursor:'pointer',background:aberto?'#F0F5FF':'#fff'}}>
        <div style={{padding:'12px 8px'}}>
          <code style={{fontSize:12,fontFamily:'monospace',background:'#F4F5F7',padding:'3px 7px',borderRadius:4,color:'#222'}}>{sol.protocolo}</code>
        </div>
        <div style={{padding:'12px 8px'}}>
          <div style={{fontSize:14,fontWeight:800,color:C.brandDark,marginBottom:3}}>{sol.api}</div>
          <span style={{fontSize:11,fontWeight:800,background:C.brandLight,color:C.brand,padding:'2px 8px',borderRadius:100,border:`1px solid ${C.brandBorder}`}}>{sol.orgao}</span>
        </div>
        <div style={{padding:'12px 8px',fontSize:13,fontWeight:600,color:C.text}}>{sol.dataCriacao.split(',')[0]}</div>
        <div style={{padding:'12px 8px'}}><StatusBadge fase={sol.fase}/></div>
        <div style={{padding:'12px 8px',textAlign:'right'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.brand} strokeWidth="2.5" style={{transform:aberto?'rotate(180deg)':'none',transition:'transform .2s'}}><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      {aberto && (
        <div style={{padding:'18px 22px',background:'#fff',borderTop:`1px solid ${C.divider}`}}>
          <div style={{background:'#F8FAFC',border:`1px solid ${C.divider}`,borderRadius:10,padding:'14px 16px',display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:14}}>
            {[
              ['Data da criação',sol.dataCriacao],
              ['Data da última atualização',sol.dataAtualizacao],
              ['Status',sol.status],
              ['Protocolo',sol.protocolo.replace('SEI-PE ','')]
            ].map(([k,v])=>(
              <div key={k}>
                <div style={{fontSize:11,color:C.brand,fontWeight:600,marginBottom:5}}>{k}</div>
                <div style={{fontSize:13,color:C.text,fontWeight:600,fontFamily:k==='Protocolo'?'monospace':'inherit'}}>{v}</div>
              </div>
            ))}
          </div>

          <Timeline fase={sol.fase}/>
          <BannerFase fase={sol.fase}/>

          <div style={{background:C.warningBg,border:`1px solid ${C.warningBorder}`,borderRadius:8,padding:'10px 12px',display:'flex',gap:9,alignItems:'flex-start',marginBottom:18}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.warning} strokeWidth="2" style={{flexShrink:0,marginTop:1}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span style={{fontSize:12,color:C.warning,lineHeight:1.55}}>O link de acompanhamento é pessoal e não deve ser compartilhado. O compartilhamento é de responsabilidade do usuário.</span>
          </div>

          <div>
            <h3 style={{fontSize:22,fontWeight:800,color:'#063147',display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
              <IconeTituloHistorico/> Histórico <span style={{height:1,background:C.divider,flex:1}}/>
            </h3>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {sol.historico.map((h,i)=>(
                <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                  <IconeHistorico tipo={h.tipo}/>
                  <div style={{background:'#fff',border:`1px solid ${C.border}`,borderRadius:8,padding:'13px 16px',minWidth:260,maxWidth:620}}>
                    <div style={{display:'flex',gap:12,alignItems:'baseline',marginBottom:8}}>
                      <strong style={{fontSize:13,color:'#063147'}}>{h.titulo}</strong>
                      <span style={{fontSize:12,color:C.textSec}}>{h.data}</span>
                    </div>
                    <p style={{fontSize:13,color:'#063147',lineHeight:1.65,whiteSpace:'pre-line'}}>{h.texto}</p>
                    {h.acao && <button style={{marginTop:10,height:32,padding:'0 18px',borderRadius:100,border:'none',background:'#1351B4',color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer'}}>{h.acao}</button>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MinhasSolicitacoes(){
  const [fase,setFase]=React.useState('');
  const [ordem,setOrdem]=React.useState('recente');
  const fases = ['Em análise','Concluído','Cancelado'];

  const lista = [...SOLICITACOES]
    .filter(s=>!fase || s.fase===fase)
    .sort((a,b)=>{
      if(ordem==='antigo') return a.id-b.id;
      if(ordem==='protocolo') return a.protocolo.localeCompare(b.protocolo);
      return b.id-a.id;
    });

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <GovBar/>
      <Header/>
      <main style={{flex:1,padding:'32px 24px',maxWidth:1120,width:'100%',margin:'0 auto'}}>
        <div style={{marginBottom:24}}>
          <h1 style={{fontSize:28,fontWeight:800,color:C.brandDark,letterSpacing:'-.3px',marginBottom:4}}>Minhas solicitações</h1>
          <p style={{fontSize:14,color:C.textSec}}>Acompanhe suas solicitações de acesso às APIs do Conecta Gov.PE.</p>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginBottom:18}}>
          <div>
            <label style={{display:'block',fontSize:13,fontWeight:600,color:C.text,marginBottom:8}}>Fase</label>
            <div style={{position:'relative'}}>
              <select value={fase} onChange={e=>setFase(e.target.value)} style={{width:'100%',height:42,border:'none',borderBottom:`1px solid ${C.border}`,background:'transparent',fontSize:15,color:C.text,outline:'none',appearance:'none',paddingRight:28,cursor:'pointer'}}>
                <option value="">Todas as fases</option>
                {fases.map(f=><option key={f} value={f}>{f}</option>)}
              </select>
              <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:C.brand}}>⌄</span>
            </div>
          </div>
          <div>
            <label style={{display:'block',fontSize:13,fontWeight:600,color:C.text,marginBottom:8}}>Classificar por</label>
            <div style={{position:'relative'}}>
              <select value={ordem} onChange={e=>setOrdem(e.target.value)} style={{width:'100%',height:42,border:'none',borderBottom:`1px solid ${C.border}`,background:'transparent',fontSize:15,color:C.text,outline:'none',appearance:'none',paddingRight:28,cursor:'pointer'}}>
                <option value="recente">Atualização mais recente</option>
                <option value="antigo">Data de criação</option>
                <option value="protocolo">Protocolo</option>
              </select>
              <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:C.brand}}>⌄</span>
            </div>
          </div>
        </div>

        <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,margin:'8px 0 20px'}}>
          <button onClick={()=>setFase('')} style={{padding:'11px 18px',border:'none',background:'transparent',fontSize:15,fontWeight:800,color:!fase?C.brand:C.text,borderBottom:!fase?`3px solid ${C.brand}`:'3px solid transparent',marginBottom:-1,cursor:'pointer'}}>
            {usuario.tipoLabel} ({SOLICITACOES.length})
          </button>
        </div>

        <section style={{background:'#fff',border:`1px solid ${C.divider}`,borderRadius:10,overflow:'hidden',boxShadow:'0 1px 5px rgba(0,0,0,.04)'}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr 2.5fr 1.4fr 1.4fr 60px',background:'#F8FAFC',borderBottom:`1px solid ${C.divider}`,padding:'0 16px'}}>
            {['Nº do protocolo','Solicitação','Data da requisição','Fase',''].map((h,i)=>(
              <div key={h} style={{padding:'12px 8px',fontSize:12,fontWeight:800,color:C.textSec,textAlign:i===4?'right':'left'}}>{h}</div>
            ))}
          </div>
          {lista.length ? lista.map(s=><LinhaSolicitacao key={s.id} sol={s}/>) : (
            <div style={{padding:48,textAlign:'center',fontSize:14,color:C.textSec}}>Nenhuma solicitação encontrada para a fase selecionada.</div>
          )}
          <div style={{padding:'11px 16px',background:'#F8FAFC',borderTop:`1px solid ${C.divider}`,display:'flex',gap:8,alignItems:'center'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span style={{fontSize:12,color:'#777'}}>Dados somente leitura · Sincronizados com o Solicita/SEI · As solicitações são gerenciadas exclusivamente no SEI.</span>
          </div>
        </section>
      </main>

      <footer style={{background:C.brand,padding:'20px 24px',marginTop:'auto'}}>
